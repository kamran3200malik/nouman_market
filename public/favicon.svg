<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="luxeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#luxeGrad)" filter="url(#subtleShadow)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />

  <!-- Luxury Monogram 'B' -->
  <text x="60" y="88" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">B</text>

  <!-- Starlight Sparkle Accent -->
  <path d="M 88 28 Q 96 38 106 40 Q 96 42 88 52 Q 86 42 76 40 Q 86 38 88 28 Z" fill="url(#goldGlow)" />
  <circle cx="88" cy="40" r="2.5" fill="#FFFFFF" />
</svg>
